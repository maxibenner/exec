<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Exec · Mobile concept</title>
<style>
:root{color-scheme:light;--paper:#f7f6f2;--ink:#252922;--muted:#797d73;--line:#e4e5de;--accent:#3d5542;--bubble:#e9ece3;--surface:#fffefa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e7e8e1;font-size:15px}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:0;background:none}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}.icon:hover{background:var(--bubble)}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px;gap:90px}.caption{max-width:270px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}.caption h1{font-size:40px;line-height:1.12;font-weight:500;letter-spacing:-1.7px;margin:20px 0}.caption p{color:var(--muted);line-height:1.7;font-size:14px}.caption .note{font-size:12px;border-top:1px solid #d1d5c9;padding-top:20px;margin-top:32px}.reset{padding:0;margin-top:12px;color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.app{width:390px;height:min(830px,calc(100dvh - 64px));min-height:430px;background:var(--paper);border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 24px 90px #28342318,0 0 0 1px #29372212}.top{padding:25px 19px 12px;border-bottom:1px solid var(--line);flex-shrink:0}.brand{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;letter-spacing:-.2px;padding:0 6px 14px}.brand .app-icon{width:24px;height:24px;object-fit:contain}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.picker{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 6px;border-radius:10px;min-width:0;font-size:20px;letter-spacing:-.6px;font-weight:550}.picker span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.picker svg{width:16px;color:var(--muted)}
.messages{flex:1;overflow:auto;overscroll-behavior:contain;padding:25px 24px 12px;scroll-behavior:smooth}.date{text-align:center;font-size:11px;color:var(--muted);margin:0 0 28px}.message{font-size:14px;line-height:1.7;margin:0 0 25px;overflow-wrap:anywhere}.message p{margin:0 0 12px;white-space:pre-wrap}.message p:last-child{margin-bottom:0}.message.user{margin-left:35px;padding:13px 17px;background:var(--bubble);border-radius:19px 19px 5px 19px}.changes{border:1px solid var(--line);border-radius:12px;margin:15px 0 0;background:#ffffff45;padding:3px 13px}.change{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:12px}.change+.change{border-top:1px solid var(--line)}.change code{font-size:11px}.change span{color:var(--accent);font-size:11px}.approval{border:1px solid #d8ddcf;border-radius:14px;padding:14px;margin-top:15px;background:var(--surface)}.approval strong{font-size:13px;font-weight:600}.approval p{font-size:12px;color:var(--muted);margin:5px 0 14px}.actions{display:flex;gap:8px}.actions button{flex:1;border-radius:9px;padding:9px;background:var(--bubble);font-size:12px;font-weight:600}.actions .allow{background:var(--accent);color:white}.decision{font-size:12px;color:var(--accent);margin-top:10px}.empty{padding-top:70px}.empty h2{font-size:26px;font-weight:500;letter-spacing:-.8px}.empty p{color:var(--muted);font-size:14px}.suggestion{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;text-align:left;width:100%}
.composer-wrap{padding:12px 17px max(22px,env(safe-area-inset-bottom));flex-shrink:0;background:var(--paper)}.composer{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 16px;border:1px solid #daddd2;border-radius:24px;background:var(--surface);box-shadow:0 2px 4px #00000002}.composer textarea{resize:none;min-height:34px;max-height:120px;width:100%;border:0;outline:none;background:none;font-size:14px;line-height:22px;padding:6px 0}.composer textarea::placeholder{color:#909487}.send{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:white}.send:disabled{background:#e6e9df;color:#a6ad9c;cursor:default}.send svg{width:18px;height:18px}.stop-shape{width:10px;height:10px;border-radius:2px;background:currentColor}
dialog{position:absolute;inset:auto 0 0;margin:0;width:100%;max-width:none;max-height:85%;border:0;border-radius:26px 26px 0 0;background:var(--paper);padding:0;color:var(--ink);box-shadow:0 -10px 50px #00000010}dialog::backdrop{background:#20271f40;backdrop-filter:blur(3px)}.sheet-inner{padding:10px 22px max(24px,env(safe-area-inset-bottom))}.handle{width:32px;height:4px;border-radius:4px;background:#cdd0c5;margin:0 auto 15px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet-head h2{font-size:23px;font-weight:500;letter-spacing:-.6px;margin:0}.chat-list{max-height:330px;overflow:auto}.chat-row{width:100%;text-align:left;display:flex;gap:12px;padding:16px 10px;border-radius:12px;margin-bottom:4px}.chat-row.selected{background:var(--bubble)}.dot{width:6px;height:6px;background:transparent;flex-shrink:0;border-radius:50%;margin-top:6px}.selected .dot{background:var(--accent)}.chat-copy{min-width:0;flex:1}.chat-title{font-size:14px;font-weight:550;display:block}.chat-preview{font-size:12px;color:var(--muted);display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-time{font-size:10px;color:var(--muted);padding-top:3px}
@media(min-width:701px){dialog{position:fixed;width:390px;left:calc(50% + 180px);transform:translateX(-50%);bottom:max(32px,calc((100dvh - 830px)/2));border-radius:26px 26px 36px 36px}}
@media(max-width:700px){.stage{padding:0;display:block}.caption{display:none}.app{width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}.top{padding-top:max(18px,env(safe-area-inset-top))}.messages{padding-left:22px;padding-right:22px}dialog{position:fixed}.composer textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>

<script>
'use strict';
// Entirely local, disposable mock data. No requests or persistent storage.
const $ = id => document.getElementById(id);
const icon = name => `<svg aria-hidden="true"><use href="#${name}"/></svg>`;
let chats, active, nextID = 4;
function seed() {
  if (chats) chats.forEach(chat => clearTimeout(chat.timer));
  chats = [
    {id:1,title:'Website updates',time:'Now',messages:[
      {role:'user',text:'Can you make the mobile navigation feel a little simpler?'},
      {role:'assistant',text:'Absolutely. I’d keep the logo and one menu button, and tuck the secondary links into a drawer.\n\nA little more breathing room, with everything still one tap away.'},
      {role:'user',text:'That sounds good. Go ahead.'},
      {role:'assistant',text:'The changes are ready to apply.',files:true,approval:'pending'}
    ]},
    {id:2,title:'Login bug',time:'34m',messages:[
      {role:'user',text:'What was causing the login issue?'},
      {role:'assistant',text:'The app was holding on to an expired session after waking from sleep.\n\nI’ve prepared a change that clears the stale session and asks you to sign in again, rather than leaving you on a blank screen.'},
      {role:'user',text:'And the existing conversations?'},
      {role:'assistant',text:'They stay untouched. Only the expired authentication state is cleared.'}
    ]},
    {id:3,title:'Weekend project',time:'Mon',messages:[
      {role:'user',text:'Let’s sketch a tiny reading list app.'},
      {role:'assistant',text:'Three things to start:\n\n1. Save a link.\n2. See your unread list.\n3. Mark something as read.\n\nNo folders, tags, or recommendations yet. Just a quiet place for things you want to come back to.'}
    ]}
  ];
  active = 1; nextID = 4; $('input').value = ''; render(); resizeInput();
}
function current() { return chats.find(chat => chat.id === active); }
function paragraph(text) { const p = document.createElement('p'); p.textContent = text; return p; }
function render() {
  const chat = current(); $('title').textContent = chat.title;
  const area = $('messages'); area.replaceChildren();
  if (!chat.messages.length) {
    const empty = document.createElement('div'); empty.className = 'empty';
    empty.innerHTML = '<h2>What’s on your mind?</h2><p>Pick up a task, or start something new.</p>';
    ['Review the latest changes','Help me plan a small feature'].forEach(text => {
      const button = document.createElement('button'); button.className = 'suggestion'; button.textContent = text;
      button.onclick = () => { $('input').value = text; resizeInput(); $('input').focus(); }; empty.append(button);
    }); area.append(empty);
  } else {
    const date = document.createElement('div'); date.className = 'date'; date.textContent = chat.id === 3 ? 'Monday' : 'Today'; area.append(date);
  }
  chat.messages.forEach(message => {
    const el = document.createElement('article'); el.className = `message ${message.role}`;
    el.append(paragraph(message.text));
    if (message.files) {
      const files = document.createElement('div'); files.className = 'changes';
      files.innerHTML = '<div class="change"><code>Header.swift</code><span>+12 −28</span></div><div class="change"><code>MobileMenu.swift</code><span>+36 −14</span></div>'; el.append(files);
    }
    if (message.approval) {
      const card = document.createElement('div'); card.className = 'approval';
      const heading = document.createElement('strong'); heading.textContent = 'Apply these changes?'; card.append(heading);
      card.append(paragraph('Update 2 files in the website project.'));
      if (message.approval === 'pending') {
        const actions = document.createElement('div'); actions.className = 'actions';
        ['Deny','Allow'].forEach(label => {
          const button = document.createElement('button'); button.textContent = label; if (label === 'Allow') button.className = 'allow';
          button.onclick = () => { message.approval = label === 'Allow' ? 'allowed' : 'denied'; chat.messages.push({role:'assistant',text:label === 'Allow' ? 'Done — the mobile header now has a single menu button and larger tap targets. The secondary links are in the drawer.\n\nThis is a demo; no actual files were changed.' : 'No changes applied. We can try a different approach.'}); render(); }; actions.append(button);
        }); card.append(actions);
      } else { const decision = document.createElement('div'); decision.className = 'decision'; decision.textContent = message.approval === 'allowed' ? '✓ Allowed' : 'Denied · No changes applied'; card.append(decision); }
      el.append(card);
    }
    area.append(el);
  });
  updateSend(); area.scrollTop = area.scrollHeight;
}
function updateSend() {
  const busy = Boolean(current().timer); $('send').disabled = !busy && !$('input').value.trim();
  $('send').setAttribute('aria-label',busy ? 'Stop response' : 'Send message');
  $('send').innerHTML = busy ? '<span class="stop-shape"></span>' : icon('arrow');
}
function resizeInput() { const input = $('input'); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight,120) + 'px'; updateSend(); }
function newChat() {
  if ($('chats').open) $('chats').close();
  chats.unshift({id:nextID++,title:'New conversation',time:'Now',messages:[]}); active = chats[0].id;
  $('input').value = ''; render(); resizeInput(); $('input').focus();
}
function openPicker() {
  const list = $('chat-list'); list.replaceChildren();
  chats.forEach(chat => {
    const row = document.createElement('button'); row.className = 'chat-row' + (active === chat.id ? ' selected' : '');
    row.setAttribute('aria-current',active === chat.id ? 'true' : 'false');
    row.innerHTML = '<span class="dot"></span><span class="chat-copy"><span class="chat-title"></span><span class="chat-preview"></span></span><span class="chat-time"></span>';
    row.querySelector('.chat-title').textContent = chat.title;
    row.querySelector('.chat-preview').textContent = chat.messages.at(-1)?.text || 'A fresh start';
    row.querySelector('.chat-time').textContent = chat.time;
    row.onclick = () => { active = chat.id; $('input').value = ''; $('chats').close(); render(); resizeInput(); }; list.append(row);
  }); $('chats').showModal();
}
$('composer').addEventListener('submit', event => {
  event.preventDefault(); const chat = current();
  if (chat.timer) { clearTimeout(chat.timer); chat.timer = null; chat.messages.push({role:'assistant',text:'Response stopped.'}); render(); return; }
  const text = $('input').value.trim(); if (!text) return;
  chat.messages.push({role:'user',text});
  if (chat.title === 'New conversation') chat.title = text.length > 28 ? text.slice(0,28) + '…' : text;
  $('input').value = ''; resizeInput();
  chat.timer = setTimeout(() => {
    chat.timer = null;
    chat.messages.push({role:'assistant',text:'I’d start with the smallest useful version, make the change in one place, and check it on a narrow screen.\n\nThis is a canned demo reply — your message wasn’t sent anywhere.'});
    if (active === chat.id) render();
  },1800); render();
});
$('input').addEventListener('input',resizeInput);
$('input').addEventListener('keydown',event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); if (!current().timer) $('composer').requestSubmit(); } });
$('picker').onclick = openPicker; $('new-chat').onclick = newChat;
$('close-sheet').onclick = () => $('chats').close();
$('chats').addEventListener('click',event => { if (event.target === $('chats')) { const rect = $('chats').getBoundingClientRect(); if (event.clientY < rect.top || event.clientX < rect.left || event.clientX > rect.right || event.clientY > rect.bottom) $('chats').close(); } });
$('reset').onclick = seed;
seed();
</script>
</body>

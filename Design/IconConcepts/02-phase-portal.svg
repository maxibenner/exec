<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Exec — Phase Portal</title><desc id="desc">A luminous cyan and violet glass portal with a white arrow passing through its center on a deep blue tile.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141f4c"/><stop offset="1" stop-color="#060915"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8ffff"/><stop offset=".32" stop-color="#42d9ed"/><stop offset=".62" stop-color="#6b52ea"/><stop offset="1" stop-color="#f1aaff"/></linearGradient>
<linearGradient id="shaft" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#a8e7ff"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#535bff" stop-opacity=".65"/><stop offset="1" stop-color="#535bff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
<ellipse cx="518" cy="536" rx="370" ry="375" fill="url(#halo)"/>
<ellipse cx="530" cy="512" rx="206" ry="285" fill="none" stroke="#6975ff" stroke-width="54" opacity=".6" filter="url(#glow)"/>
<ellipse cx="530" cy="512" rx="206" ry="285" fill="#102653" fill-opacity=".3" stroke="url(#glass)" stroke-width="56"/>
<ellipse cx="530" cy="512" rx="181" ry="259" fill="none" stroke="#b6d8ff" stroke-opacity=".4" stroke-width="3"/>
<path d="M246 465H579V370L757 512L579 654V559H246Z" fill="url(#shaft)"/>
<path d="M530 227C416 227 324 355 324 512S416 797 530 797" fill="none" stroke="url(#glass)" stroke-width="56"/>
<path d="M510 231C409 245 332 366 332 490" fill="none" stroke="#e5ffff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</svg>
